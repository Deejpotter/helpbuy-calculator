server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json image/x-icon;
  gzip_min_length 512;
  gzip_vary on;

  # hashed bundles: cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # nginx's mime.types has no webmanifest entry, so it would go out as octet-stream
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # single page app: never cache the entry, everything else is index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
